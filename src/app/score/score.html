<div class="flex flex-col justify-start items-center h-screen w-full gap-4 bg-[#1c1c1c] pl-48 pr-48 pt-10 pb-10">

    <div class="absolute top-8 left-8 flex justify-center items-center">
        <button (click)="nav.menu()" class="p-2 bg-orange-600 text-white rounded-full">
            Back
        </button>
    </div>

    <h1 class="text-4xl text-white font-bold mb-8">Scoreboard</h1>

    <div class="flex justify-between items-center h-12 w-full bg-[#1c1c1c] 
        rounded-[16rem] shadow-[inset_0_0_0_3px_#d47108] p-4 text-lg text-white font-bold">
        <span>Spieler</span>
        <span>Score</span>
        <span>Zeit</span>
    </div>
    <div class="w-[94%] rounded-[16rem] border-2 border-[#d47108] mt-2 mb-2"></div>
    @for (score of scores; track $index) {
        <div class="flex justify-between items-center h-12 w-full bg-[#d47108] border-3 border-[#d47108] 
            rounded-[16rem] shadow-[inset_0_0_0_4px_#1c1c1c] p-4 text-lg text-white font-bold transition-all duration-500" 
            [class.score-updated]="score.justUpdated">
            <span>{{ score.player }}</span>
            <span>{{ score.score }}</span>
            <span>{{ score.time }} ms</span>
        </div>
    }
</div>
