<div class="w-full flex justify-center">
    <div class="flex flex-col justify-start items-center w-full max-w-7xl sm:gap-4 gap-2
        lg:pl-48 md:pl-24 lg:pr-48 md:pr-24 sm:pl-12 sm:pr-12 pl-6 pr-6 sm:pt-10 pt-5 sm:pb-10 pb-5">
        <div class="absolute sm:top-8 sm:left-8 top-4 left-4 flex justify-center items-center">
            <button (click)="nav.menu()"
                class="flex justify-center items-center sm:h-8 h-7 sm:w-20 w-16 bg-[#1c1c1c] sm:border-2 border border-[#d47108] rounded-full 
                sm:text-md text-sm leading-none text-shadow-md/30 hover:text-shadow-md/5 text-white font-bold antialiased pointer pt-0.5">
                Menu
            </button>
        </div>

        <h1 class="sm:text-4xl text-2xl text-white text-shadow-lg/100 font-bold sm:mb-6 mb-3">Scoreboard</h1>

        <div class="flex justify-between items-center sm:h-12 h-8 w-full bg-[#1c1c1c] 
            rounded-[16rem] sm:shadow-[inset_0_0_0_3px_#d47108] shadow-[inset_0_0_0_2px_#d47108] p-4 sm:text-lg text-md text-white font-bold">
            <span class="w-1/3 text-start text-shadow-md/50 pt-0.5">Score</span>
            <span class="w-1/3 text-center text-shadow-md/50 pt-0.5">Spieler</span>
            <span class="w-1/3 text-end text-shadow-md/50 pt-0.5">Zeit</span>
        </div>
        <div class="w-[94%] rounded-[16rem] sm:border-2 border border-[#d47108] mt-2 mb-2"></div>
        <div class="score-wrapper relative flex flex-col h-full w-full">
            @for (score of scores; let i = $index; track score.id) {
                <div [attr.data-id]="score.id" class="score-row absolute flex justify-center items-center sm:h-12 h-8 w-full sm:pb-1.5 pb-0">
                    <div class="flex justify-between items-center h-full w-full bg-[#d47108] sm:border-2 border border-[#d47108] 
                        rounded-[16rem] sm:shadow-[inset_0_0_0_3px_#1c1c1c] shadow-[inset_0_0_0_2px_#1c1c1c] p-4 sm:text-lg text-md 
                        text-[#1c1c1c] font-bold transition-all duration-500" [style.animationDelay.ms]="i * 85">
                        <span class="w-1/3 text-start text-shadow-md/10 pt-0.5">{{ score.score }}</span>
                        <span class="w-1/3 text-center text-shadow-md/10 pt-0.5">{{ score.player.name }}</span>
                        <span class="w-1/3 text-end text-shadow-md/10 pt-0.5">{{ formatTime(score.time) }}</span>
                    </div>
                </div>
            }
            <div style="height: 2rem;"></div>
        </div>
    </div>
</div>
