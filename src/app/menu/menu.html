<div class="bg-[#2c2c2c] bg-stripes h-full w-full flex">
    <div class="flex flex-col sm:justify-center justify-start items-center h-screen w-full sm:gap-12 gap-6 text-white 
    sm:pt-0 pt-8 sm:pb-0 pb-8 sm:pl-6 sm:pr-6 pl-12 pr-12">
        @if (showInput) {
            <input [(ngModel)]="playerName" type="text" placeholder="Dein Name..." minlength="3" #nameInput="ngModel" required
                (keydown.enter)="register(nameInput)"
                class="flex justify-center items-center md:h-22 sm:h-19 h-16 md:w-108 sm:w-100 w-full 
                bg-[#1c1c1c] rounded-full md:text-2xl sm:text-xl text-lg leading-none text-shadow-md/50 
                text-white font-bold antialiased pointer pt-0.5 text-center" />
            <button (click)="register(nameInput)" type="button" [disabled]="nameInput.invalid" 
                class="flex justify-center items-center md:h-22 sm:h-19 h-16 md:w-108 sm:w-100 w-full bg-[#1c1c1c] rounded-full 
                md:text-2xl sm:text-xl text-lg leading-none text-shadow-md/50 hover:text-shadow-md/10 text-white font-bold 
                antialiased pointer pt-0.5 hover:pt-1 disabled:pt-0.5">
                Registrieren
            </button>
        } 
        @if (game && !showInput && !game.quiz_completed) {
            <button (click)="play()" type="button" class="flex justify-center items-center md:h-22 sm:h-19 h-16 md:w-108 sm:w-100 w-full 
                bg-[#1c1c1c] rounded-full md:text-2xl sm:text-xl text-lg leading-none text-shadow-md/50 
                hover:text-shadow-md/10 text-white font-bold antialiased pointer pt-0.5 hover:pt-1">
                {{ game.answered_questions ? 'Weiter' : 'Start' }}
            </button>
        }
        @if (!game && !showInput || game?.quiz_completed) {
            @for(quiz of gameService.quizzes$ | async; track quiz.id) {
                <button (click)="selectQuiz(quiz)" type="button" class="flex justify-center items-center md:h-22 sm:h-19 h-16 md:w-108 sm:w-100 w-full 
                    bg-[#1c1c1c] rounded-full md:text-2xl sm:text-xl text-lg leading-none text-shadow-md/50 
                    hover:text-shadow-md/10 text-white font-bold antialiased pointer pt-0.5 hover:pt-1">
                    {{ quiz.title }}
                </button>
            }
            @if ((gameService.quizzes$ | async)?.length ?? 0 > 0) {
                <button (click)="nav.score()" type="button" class="flex justify-center items-center md:h-22 sm:h-19 h-16 md:w-108 sm:w-100 w-full 
                    bg-[#1c1c1c] rounded-full md:text-2xl sm:text-xl text-lg leading-none text-shadow-md/50 
                    hover:text-shadow-md/10 text-white font-bold antialiased pointer pt-0.5 hover:pt-1">
                    Scoreboard
                </button>
            }
        }
    </div>
</div>
