<div class="flex flex-col justify-center items-center h-screen w-full gap-4 bg-[#1c1c1c] p-8">

    <div class="relative w-full h-96 perspective">
        <div class="relative w-full h-full transition-transform duration-700 transform-style-preserve-3d"
            [style.transform]="flipRotation">

            <div class="absolute w-full h-full backface-hidden flex flex-col justify-center items-center
                bg-[#1c1c1c] rounded-[16rem] shadow-[inset_0_0_0_5px_#d47108] text-white">
                @if (step === 0) {
                <div class="flex flex-col justify-center items-center gap-4">
                    <span class="text-4xl">Name</span>
                    <input type="text" class="p-2 rounded-md text-black" placeholder="Enter your name" />
                </div>
                }
                @if (step > 0 && step % 2 === 0) {
                    <div class="flex flex-col justify-center items-center gap-4 p-48 text-center">
                        <span class="text-3xl">{{ queue[currentQuestionIndex]?.title }}</span>
                    </div>
                }
            </div>

            <div class="absolute w-full h-full backface-hidden rotate-x-180 flex flex-col justify-center items-center
            bg-[#1c1c1c] rounded-[16rem] shadow-[inset_0_0_0_5px_#d47108] text-white">
                @if (step > 0 && step % 2 === 1) {
                <div class="flex flex-col justify-center items-center gap-4 p-48 text-center">
                    <span class="text-4xl">Frage {{ currentQuestionIndex + 1 }} / {{ queue.length }}</span>
                </div>
                }
            </div>
        </div>
    </div>

    <button (click)="nextStep()" [disabled]="isFlipping" class="mt-4 px-4 py-2 bg-orange-600 text-white rounded-md">
        Nächste Frage
    </button>

    <!-- <div class="flex flex-col gap-2 w-full">
    @for (answer of queue[currentQuestionIndex]?.answers; track answer) {
    <button class="bg-orange-700 hover:bg-orange-800 rounded-md py-2 text-lg">
        {{ answer.text }}
    </button>
    }
</div> -->
    <div class="z-100 flex flex-col justify-center items-start h-2 w-[82%] bg-[#2c2c2c] rounded-[16rem] mt-2 mb-2">
        <span class="loader" [ngClass]="{'timer-animation': timeRunning}"></span>
    </div>

    <div class="relative w-full h-96 perspective">
        <div class="relative w-full h-full transition-transform duration-700 transform-style-preserve-3d"
            [style.transform]="flipRotation">

            <div class="absolute w-full h-full backface-hidden flex flex-col justify-center items-start
                bg-[#1c1c1c] rounded-[16rem]">
                <div class="relative grid grid-cols-2 grid-rows-2 h-96 w-full gap-4 place-items-center">
                    <div (click)="answer(1)" class="flex justify-center items-center h-full w-full bg-[#d47108] border-4 border-[#d47108] 
                        rounded-[16rem] rounded-tr-3xl rounded-bl-3xl shadow-[inset_0_0_0_5px_#1c1c1c]">
                        <span class="text-2xl text-white">Answer 1</span>
                    </div>
                    <div (click)="answer(2)" class="flex justify-center items-center h-full w-full bg-[#d47108] border-4 border-[#d47108] 
                        rounded-[16rem] rounded-tl-3xl rounded-br-3xl shadow-[inset_0_0_0_5px_#1c1c1c]">
                        <span class="text-2xl text-white">Answer 2</span>
                    </div>
                    <div (click)="answer(3)" class="flex justify-center items-center h-full w-full bg-[#d47108] border-4 border-[#d47108] 
                        rounded-[16rem] rounded-br-3xl rounded-tl-3xl shadow-[inset_0_0_0_5px_#1c1c1c]">
                        <span class="text-2xl text-white">Answer 3</span>
                    </div>
                    <div (click)="answer(4)" class="flex justify-center items-center h-full w-full bg-[#d47108] border-4 border-[#d47108] 
                        rounded-[16rem] rounded-bl-3xl rounded-tr-3xl shadow-[inset_0_0_0_5px_#1c1c1c]">
                        <span class="text-2xl text-white">Answer 4</span>
                    </div>

                    <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
                        <div class="flex justify-center items-center text-4xl text-white font-bold">
                            <span class="counter">{{ formattedTime }}</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="absolute w-full h-full backface-hidden rotate-x-180 flex flex-col justify-center items-start
                bg-[#d47108] border-4 border-[#d47108] rounded-[16rem] shadow-[inset_0_0_0_5px_#1c1c1c]">
            </div>

        </div>
    </div>

</div>
