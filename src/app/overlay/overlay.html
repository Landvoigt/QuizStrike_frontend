@if(visible) {
    <div class="overlay">
        @if(currentIndex === 0) {
            <div class="countdown pop">3</div>
        }

        @if(currentIndex === 1) {
            <div class="countdown pop">2</div>
        }

        @if(currentIndex === 2) {
            <div class="countdown pop">1</div>
        }

        @if(currentIndex === 3) {
            <div class="countdown pop">Go!</div>
        }
    </div>
}
